<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>순발력 테스트 게임</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--fg:#1f2430;--sub:#6b7280;--acc:#4f46e5;--accfg:#fff;--line:#e5e7eb;--cell:#eef0ff;--done:#d1d5db;--gold:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c2030;--fg:#eef0f6;--sub:#9aa3b5;--acc:#8b85ff;--line:#2d3348;--cell:#2a2f4a;--done:#3a4057;--gold:#fcd34d}
:root[data-theme="ocean"]{--bg:#e8f4fb;--card:#fff;--fg:#0b2a3c;--sub:#4b6b7e;--acc:#0284c7;--line:#cfe6f3;--cell:#dff0fb;--done:#b9d3e3}
:root[data-theme="forest"]{--bg:#eef6ee;--card:#fff;--fg:#17301d;--sub:#5a7461;--acc:#2f855a;--line:#d3e6d6;--cell:#e2f1e4;--done:#bcd3c0}
:root[data-theme="sunset"]{--bg:#fff1ea;--card:#fff;--fg:#3b1f1a;--sub:#8a6258;--acc:#e8590c;--line:#f6d8cc;--cell:#ffe4d6;--done:#e6c9bd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;display:flex;gap:8px;z-index:5}
#onl{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:5;padding:9px 12px;border-radius:12px;background:var(--cell);color:var(--fg);font-size:.85rem;font-weight:600;display:none}
#topbar button{padding:8px 12px;font-size:.9rem}
main{max-width:480px;margin:0 auto;padding:56px 16px 16px}
h1{text-align:center;font-size:1.5rem;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
#screen{min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 20px;background:var(--acc);color:var(--accfg);font-weight:600}
button.ghost{background:var(--cell);color:var(--fg)}
button.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.lv{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.big{font-size:2.2rem;font-weight:800;letter-spacing:.05em}
.note{color:var(--sub);font-size:.95rem}
#grid{display:grid;gap:6px;width:100%;max-width:400px}
#grid button{aspect-ratio:1;padding:0;background:var(--cell);color:var(--fg);font-size:1.5rem;border:1px solid var(--line)}
#grid button.done{background:var(--done);color:transparent}
#grid button.bad{background:#fca5a5}
#timer{font-variant-numeric:tabular-nums;color:var(--sub)}
input[type=text]{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:180px}
.tabs{display:flex;gap:6px;margin:18px 0 8px}
.tabs button{flex:1;padding:9px}
.tabs button:not(.on){background:var(--cell);color:var(--fg)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
th{color:var(--sub);font-weight:600}
td.n{text-align:left;word-break:break-all}
tr.top{font-weight:700}
tr.top td:first-child{font-size:1.4rem}
tr.top1{background:rgba(250,204,21,.22)}
tr.top2{background:rgba(148,163,184,.25)}
tr.top3{background:rgba(217,119,6,.2)}
tr.top1 td:nth-child(3){color:var(--gold)}
.wrap{overflow-x:auto}
/* 팝업 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov[hidden]{display:none}
.modal{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:420px;max-height:85vh;overflow:auto;padding:16px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:1.1rem}
.mh button{padding:4px 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
.row input[type=range]{flex:1;accent-color:var(--acc)}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.themes button{padding:8px 2px;font-size:.78rem;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--cell);color:var(--fg)}
.themes button.sel{border-color:var(--acc)}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--acc);color:var(--accfg);display:flex;align-items:center;justify-content:center;font:700 1.15rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;box-shadow:0 0 0 4px var(--cell)}
.gbtn{margin-top:6px;width:100%;max-width:260px}
.gbtn:disabled{opacity:.7;cursor:default}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid var(--line)}
</style>
</head>
<body>
<div id="onl">🟢 현재 접속자 <b id="online">-</b>명</div>
<div id="topbar">
  <button class="ghost" id="myBtn">내 기록</button>
  <button class="ghost" id="setBtn" aria-label="설정">⚙️</button>
</div>
<main>
<h1>순발력 테스트 게임</h1>
<div class="card"><div id="screen"></div></div>

<div class="tabs" id="tabs"></div>
<div class="card wrap"><table>
<thead><tr><th>순위</th><th>닉네임</th><th>시간(초)</th><th>날짜</th></tr></thead>
<tbody id="lb"></tbody></table>
<div class="note" id="where" style="margin-top:8px"></div></div>
</main>

<div class="ov" id="ov" hidden><div class="modal">
  <div class="mh"><b id="mt"></b><button class="ghost" id="mx">✕</button></div>
  <div id="mb"></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ================= 설정 (본인 Firebase 정보 입력) ================= */
const DB_URL="https://quickness-1a53c-default-rtdb.firebaseio.com";
const API_KEY="AIzaSyAcAFmH-N7zWnw9TwmoBuj7oo3DsdbUW2A";
/* ================================================================ */

const LV={easy:{name:"쉬움",n:3},normal:{name:"보통",n:4},hard:{name:"어려움",n:5}};
const THEMES=[["light","기본","#4f46e5"],["dark","다크","#8b85ff"],["ocean","오션","#0284c7"],["forest","포레스트","#2f855a"],["sunset","선셋","#e8590c"]];
const $=id=>document.getElementById(id);
const screen=$("screen");
let level=null,next=1,t0=0,raf=0,wait=0,lastMs=0,saved=false,tab="easy",cur=null;
let records=[],loadErr=false;

/* ---------- 로컬 저장 도우미 ---------- */
const jget=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---------- 설정(소리/테마) ---------- */
const S=Object.assign({on:true,vol:70,theme:"light"},jget("reflex-settings",{}));
function applyTheme(){document.documentElement.dataset.theme=S.theme}
applyTheme();

/* ---------- 효과음 (WebAudio) ---------- */
let actx=null;
function ac(){
  if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C()}
  if(actx.state==="suspended")actx.resume();
  return actx;
}
function tone(f0,f1,dur,type,vol){
  const c=ac();if(!c)return;
  const t=c.currentTime,o=c.createOscillator(),g=c.createGain(),v=vol*S.vol/100;
  if(v<=0)return;
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
}
function pop(){if(!S.on)return;const b=500+Math.random()*120;tone(b*1.6,b*.5,.09,"sine",.5)}
function buzz(){if(!S.on)return;tone(180,120,.15,"square",.15)}
function fanfare(){if(!S.on)return;[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,f,.18,"triangle",.3),i*110))}
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.parentElement&&b.parentElement.id==="grid"&&Number(b.textContent)!==next)buzz();else pop();
});

/* ---------- 팝업 ---------- */
function openModal(title,build){
  $("mt").textContent=title;$("mb").innerHTML="";build($("mb"));$("ov").hidden=false;
}
function closeModal(){$("ov").hidden=true}
$("mx").onclick=closeModal;
$("ov").addEventListener("pointerdown",e=>{if(e.target===$("ov"))closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

$("setBtn").onclick=()=>openModal("설정",box=>{
  box.innerHTML=`
  <div class="prof"><div class="avatar" id="pAv"></div><div class="note">내 고유 코드</div><div class="note" id="pAcc"></div>
  <button class="ghost gbtn" id="gBtn"></button></div>
  <div class="row"><label for="sOn">효과음 켜기</label><input type="checkbox" id="sOn"></div>
  <div class="row"><span>음량</span><input type="range" id="sVol" min="0" max="100"><b id="sVal" style="width:2.5em;text-align:right"></b></div>
  <div style="margin-top:16px">테마</div><div class="themes" id="thm"></div>`;
  $("sOn").checked=S.on;$("sVol").value=S.vol;$("sVal").textContent=S.vol;
  $("sOn").onchange=e=>{S.on=e.target.checked;jset("reflex-settings",S);pop()};
  $("sVol").oninput=e=>{S.vol=+e.target.value;$("sVal").textContent=S.vol};
  $("sVol").onchange=()=>{jset("reflex-settings",S);pop()};
  const drawTh=()=>{
    $("thm").innerHTML="";
    THEMES.forEach(([k,n,c])=>{
      const b=document.createElement("button");if(k===S.theme)b.className="sel";
      b.innerHTML=`<span class="sw" style="background:${c}"></span>${n}`;
      b.onclick=()=>{S.theme=k;jset("reflex-settings",S);applyTheme();drawTh()};
      $("thm").appendChild(b);
    });
  };
  drawTh();
  $("gBtn").onclick=linkGoogle;updateProfile();
});

/* ---------- 리더보드 저장소 (Firebase REST, 익명 인증) ---------- */
const remote=!!DB_URL;
function lsBoard(){return jget("reflex-records",[])}
async function load(){
  if(!remote){records=lsBoard();loadErr=false;renderLb();return}
  try{
    const out=[];
    await Promise.all(Object.keys(LV).map(async k=>{
      const q=`?orderBy=${encodeURIComponent('"time"')}&limitToFirst=20`;
      const r=await fetch(`${DB_URL}/records/${k}.json${q}`);
      if(!r.ok)throw new Error(r.status);
      const o=await r.json()||{};
      Object.entries(o).forEach(([id,v])=>out.push({...v,id,level:k}));
    }));
    records=out;loadErr=false;
  }catch(e){loadErr=true}
  renderLb();
}
let fbAuth=null,curUid=null;
try{
  firebase.initializeApp({apiKey:API_KEY,authDomain:"quickness-1a53c.firebaseapp.com",projectId:"quickness-1a53c"});
  fbAuth=firebase.auth();
  fbAuth.onAuthStateChanged(u=>{
    if(!u){fbAuth.signInAnonymously().catch(()=>{});return}
    curUid=u.uid;updateProfile();syncMine();
  });
}catch(e){}
async function getAuth(){
  if(!fbAuth)throw new Error("no auth");
  let u=fbAuth.currentUser;
  if(!u)u=(await fbAuth.signInAnonymously()).user;
  return {uid:u.uid,idToken:await u.getIdToken()};
}
function googleInfo(){
  const u=fbAuth&&fbAuth.currentUser;
  return u?u.providerData.find(p=>p.providerId==="google.com"):null;
}
function updateProfile(){
  const av=$("pAv");if(!av)return;
  av.textContent=curUid?curUid.slice(0,6).toUpperCase():"…";
  const g=googleInfo();
  $("pAcc").textContent=g?(g.email||"Google 계정 연동됨"):"게스트 (연동 안 됨)";
  const gb=$("gBtn");gb.disabled=!!g||!fbAuth;
  gb.innerHTML=g?"✓ Google 계정 연동됨":'<b style="color:#4285f4">G</b> Google 계정 연동';
}
async function linkGoogle(){
  const u=fbAuth&&fbAuth.currentUser;if(!u)return;
  try{
    await u.linkWithPopup(new firebase.auth.GoogleAuthProvider());
  }catch(e){
    if(e.code==="auth/credential-already-in-use"&&e.credential){
      if(confirm("이미 연동된 Google 계정이 있어요. 그 계정으로 전환할까요?\n(전환하면 이 기기의 현재 게스트 기록은 삭제할 수 없게 돼요)"))
        await fbAuth.signInWithCredential(e.credential).catch(()=>alert("전환하지 못했어요."));
    }else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request"){
      alert("Google 연동에 실패했어요. ("+(e.code||"error")+")");
    }
  }
  updateProfile();
}

let lastErr="";
async function saveRecord(r){          // {id} 등록 / {skip:기존기록} 더 느려서 미등록 / null 실패
  if(!remote){
    const a=lsBoard(),id="L"+r.ts;a.push({...r,id});jset("reflex-records",a);records=a;renderLb();return {id};
  }
  try{
    const a=await getAuth();
    const url=`${DB_URL}/records/${r.level}/${a.uid}.json`;
    const g=await fetch(url);
    if(!g.ok)throw new Error(g.status);
    const old=await g.json();
    if(old&&typeof old.time==="number"&&old.time<=r.time)return {skip:old.time};
    const res=await fetch(`${url}?auth=${a.idToken}`,{method:"PUT",body:JSON.stringify({nick:r.nick,time:r.time,ts:r.ts,uid:a.uid})});
    if(!res.ok)throw new Error(res.status);
    await load();return {id:a.uid};
  }catch(e){lastErr=e&&(e.code||e.message)||"unknown";return null}
}
async function deleteRecord(level,id){  // 성공 true
  if(!remote){jset("reflex-records",lsBoard().filter(x=>x.id!==id));await load();return true}
  try{
    const a=await getAuth();
    const res=await fetch(`${DB_URL}/records/${level}/${id}.json?auth=${a.idToken}`,{method:"DELETE"});
    if(!res.ok)throw new Error(res.status);
    await load();return true;
  }catch(e){return false}
}

/* ---------- 내 플레이 기록 (이 기기) ---------- */
const getMy=()=>jget("reflex-my",[]);
function addMy(e){const a=getMy();a.unshift(e);jset("reflex-my",a.slice(0,1000))}
function updMy(mid,patch){const a=getMy();const i=a.findIndex(x=>x.mid===mid);if(i>=0){Object.assign(a[i],patch);jset("reflex-my",a)}}
/* 서버의 내 리더보드 기록을 "내 기록" 목록에 반영 (계정 전환/새 기기용) */
async function syncMine(){
  if(!remote||!curUid)return;
  const uid=curUid;
  try{
    const res=await Promise.all(Object.keys(LV).map(async k=>{
      const r=await fetch(`${DB_URL}/records/${k}/${uid}.json`);
      if(!r.ok)throw new Error(r.status);
      return [k,await r.json()];
    }));
    if(uid!==curUid)return;
    const my=getMy();
    res.forEach(([k,v])=>{
      my.forEach(x=>{if(x.level===k&&x.onBoard&&x.uid===uid&&(!v||x.ts!==v.ts)){x.onBoard=false;x.id=null}});
      if(!v||typeof v.time!=="number")return;
      const f=my.find(x=>x.level===k&&x.ts===v.ts);
      if(f)Object.assign(f,{time:v.time,onBoard:true,id:uid,nick:v.nick,uid});
      else my.push({mid:"s"+v.ts,level:k,time:v.time,ts:v.ts,onBoard:true,id:uid,nick:v.nick,uid});
    });
    my.sort((a,b)=>b.ts-a.ts);
    jset("reflex-my",my.slice(0,1000));
    if(!$("ov").hidden&&$("mt").textContent==="내 기록"){drawMy($("mb"))}
  }catch(e){}
}

const p2=x=>String(x).padStart(2,"0");
const fmt=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const fmtT=ts=>{const d=new Date(ts);return `${fmt(ts).slice(2)} ${p2(d.getHours())}:${p2(d.getMinutes())}`};

$("myBtn").onclick=()=>openModal("내 기록",box=>drawMy(box));
let myFilter="all";
function drawMy(box){
  box.innerHTML="";
  const all=getMy();
  if(!all.length){box.innerHTML='<div class="note" style="text-align:center;padding:20px 0">아직 플레이 기록이 없어요</div>';return}
  const best={};all.forEach(e=>{if(!(e.level in best)||e.time<best[e.level])best[e.level]=e.time});
  const sum=document.createElement("div");sum.className="note";sum.style.marginBottom="10px";
  sum.innerHTML=`총 <b>${all.length}</b>회 클리어<br>`+Object.keys(LV).map(k=>`${LV[k].name} 최고 ${k in best?best[k].toFixed(4)+"초":"-"}`).join(" · ");
  box.appendChild(sum);
  const fl=document.createElement("div");fl.className="tabs";fl.style.margin="0 0 8px";
  [["all","전체"],...Object.keys(LV).map(k=>[k,LV[k].name])].forEach(([k,n])=>{
    const b=document.createElement("button");b.textContent=n;b.className=k===myFilter?"on":"";
    b.onclick=()=>{myFilter=k;drawMy(box)};fl.appendChild(b);
  });
  box.appendChild(fl);
  const a=myFilter==="all"?all:all.filter(e=>e.level===myFilter);
  if(!a.length){const d=document.createElement("div");d.className="note";d.style.cssText="text-align:center;padding:16px 0";d.textContent="이 난이도의 기록이 없어요";box.appendChild(d);return}
  const t=document.createElement("table");
  t.innerHTML='<thead><tr><th>난이도</th><th>시간(초)</th><th>날짜</th><th>리더보드</th></tr></thead>';
  const tb=document.createElement("tbody");
  a.forEach(e=>{
    const tr=document.createElement("tr");
    const cells=[LV[e.level].name,Number(e.time).toFixed(4)+(e.time===best[e.level]?" ⭐":""),fmtT(e.ts)];
    cells.forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});
    const td=document.createElement("td");
    if(e.onBoard&&e.uid&&curUid&&e.uid!==curUid){td.textContent="다른 계정";td.className="note"}
    else if(e.onBoard){
      const b=document.createElement("button");b.className="sm ghost";b.textContent="삭제";
      b.title=e.nick;
      b.onclick=async()=>{
        if(!confirm(`리더보드에서 "${e.nick}" 기록(${Number(e.time).toFixed(4)}초)을 삭제할까요?`))return;
        b.disabled=true;
        if(await deleteRecord(e.level,e.id)){updMy(e.mid,{onBoard:false,id:null});drawMy(box)}
        else{alert("삭제하지 못했어요. 이 기기에서 등록한 기록만 삭제할 수 있어요.");b.disabled=false}
      };
      td.appendChild(b);
    }else td.textContent="-";
    tr.appendChild(td);tb.appendChild(tr);
  });
  t.appendChild(tb);
  const w=document.createElement("div");w.className="wrap";w.appendChild(t);box.appendChild(w);
  const n=document.createElement("div");n.className="note";n.style.marginTop="10px";
  n.textContent="⭐ = 난이도별 내 최고 기록 · 리더보드 삭제는 이 기기에서 등록한 기록에만 가능해요.";box.appendChild(n);
}

/* ---------- 게임 화면 ---------- */
function showMenu(){
  cancelAnimationFrame(raf);clearTimeout(wait);
  screen.innerHTML='<div class="note">난이도를 선택하세요</div><div class="lv" id="lvb"></div>';
  for(const k in LV){const b=document.createElement("button");b.textContent=LV[k].name;b.onclick=()=>ready(k);$("lvb").appendChild(b)}
}
function ready(k){
  level=k;tab=k;renderLb();
  screen.innerHTML='<div class="big">READY</div><div class="note">3~10초 후 시작 됩니다.</div>';
  wait=setTimeout(start,3000+Math.random()*7000);
}
function start(){
  const n=LV[level].n,total=n*n;
  const nums=Array.from({length:total},(_,i)=>i+1).sort(()=>Math.random()-.5);
  next=1;saved=false;
  screen.innerHTML='<div id="timer">0.0000</div><div id="grid"></div>';
  const g=$("grid");g.style.gridTemplateColumns=`repeat(${n},1fr)`;
  nums.forEach(v=>{
    const b=document.createElement("button");b.textContent=v;
    b.onclick=()=>press(b,v,total);g.appendChild(b);
  });
  t0=performance.now();
  (function tick(){$("timer").textContent=((performance.now()-t0)/1000).toFixed(4);raf=requestAnimationFrame(tick)})();
}
function press(b,v,total){
  if(v!==next){b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),150);return}
  b.classList.add("done");b.disabled=true;next++;
  if(next>total){lastMs=performance.now()-t0;cancelAnimationFrame(raf);clear()}
}
function clear(){
  fanfare();
  const sec=(lastMs/1000).toFixed(4),ts=Date.now();
  cur={mid:"m"+ts,level,time:+sec,ts,onBoard:false,id:null,nick:null,uid:curUid};
  addMy(cur);
  screen.innerHTML=`<div class="big">CLEAR</div><div class="big" style="font-size:1.8rem">${sec}초</div>
  <div id="rec"><button id="recBtn">기록하기</button></div>
  <button class="ghost" id="again">다시하기</button>`;
  $("recBtn").onclick=askNick;
  $("again").onclick=showMenu;
}
function askNick(){
  $("rec").innerHTML='<input type="text" id="nick" maxlength="12" placeholder="닉네임 (최대 12자)" autocomplete="off"> <button id="ok">확인</button>';
  $("nick").value=jget("reflex-nick","");$("nick").focus();
  const submit=async()=>{
    const nick=$("nick").value.trim();
    if(!nick){$("nick").focus();return}
    if(saved)return;saved=true;$("ok").disabled=true;
    const res=await saveRecord({level:cur.level,nick,time:cur.time,ts:cur.ts});
    if(res&&res.skip!==undefined){
      $("rec").innerHTML=`<div class="note">이미 더 빠른 기록(${res.skip.toFixed(4)}초)이 있어서<br>리더보드는 그대로예요.</div>`;
    }else if(res&&res.id){
      jset("reflex-nick",nick);
      const my=getMy();
      my.forEach(x=>{if(x.mid!==cur.mid&&x.level===cur.level&&x.onBoard&&x.uid===res.id){x.onBoard=false;x.id=null}});
      jset("reflex-my",my);
      updMy(cur.mid,{onBoard:true,id:res.id,nick,uid:curUid});
      $("rec").innerHTML='<div class="note">기록되었습니다 ✓</div>';
    }else{
      saved=false;$("ok").disabled=false;
      alert("서버에 기록하지 못했어요.\n오류: "+lastErr);
    }
  };
  $("ok").onclick=submit;
  $("nick").onkeydown=e=>{if(e.key==="Enter")submit()};
}

/* ---------- 리더보드 ---------- */
function renderLb(){
  $("tabs").innerHTML="";
  for(const k in LV){const b=document.createElement("button");b.textContent=LV[k].name;
    if(k===tab)b.className="on";b.onclick=()=>{tab=k;renderLb()};$("tabs").appendChild(b)}
  const rows=records.filter(r=>r.level===tab).sort((a,b)=>a.time-b.time||a.ts-b.ts).slice(0,20);
  const tb=$("lb");tb.innerHTML="";
  if(!rows.length){tb.innerHTML='<tr><td colspan="4" class="note">아직 기록이 없습니다</td></tr>'}
  rows.forEach((r,i)=>{
    const tr=document.createElement("tr");if(i<3)tr.className="top top"+(i+1);
    [i<3?["🥇","🥈","🥉"][i]:i+1,r.nick,Number(r.time).toFixed(4),fmt(r.ts)].forEach((v,j)=>{
      const td=document.createElement("td");td.textContent=v;if(j===1)td.className="n";tr.appendChild(td)});
    tb.appendChild(tr);
  });
  $("where").textContent=!remote?"이 기기에만 저장되는 리더보드":loadErr?"리더보드를 불러오지 못했어요":"전체 참여자 공유 리더보드";
}

/* ---------- 장난용 가짜 접속자 수 (0~399명, 실제 접속자와 무관) ---------- */
let fakeN=Math.floor(Math.random()*400);
function showFake(){
  const t=fakeN===0?"0명 (나 혼자…?)":fakeN>=300?fakeN+"명 🔥":fakeN+"명";
  $("onl").textContent="🟢 현재 접속자 "+t;
}
function driftFake(){
  fakeN=Math.max(0,Math.min(399,fakeN+Math.floor(Math.random()*31)-15));
  showFake();
  setTimeout(driftFake,2000+Math.random()*3000);
}
$("onl").style.display="block";showFake();setTimeout(driftFake,3000);

showMenu();load();setInterval(()=>{if(remote)load()},30000);
</script>
